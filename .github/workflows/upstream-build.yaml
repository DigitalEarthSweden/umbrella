name: upstream-build

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths: &paths
      - ".github/workflows/upstream-build.yaml"
      - "bin/print-matrix.sh"
      - "common/Makefile"
      - "upstream/**"
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  upstream-small-build:
    name: upstream-small-build
    environment:
      name: upstream-build
      deployment: false
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # This is required for cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Build
        uses: ./.github/actions/docker-build
        with:
          build-path: upstream/ubuntu
          ci-registry: ${{ vars.CI_REGISTRY }}
          ci-registry-base-path: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          ci-registry-upstream-base-path: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          do-push: ${{ github.ref == 'refs/heads/main' }}
          docker-auth-config: ${{ secrets.DOCKER_AUTH_CONFIG_UPSTREAM_RW }}
          extra-repository: ${{ matrix.extra-repository }}
          extra-repository-token: ${{ secrets.PAT_EXTRA_REPO_RO }}
          organization-name: ${{ vars.ORGANIZATION_NAME }}

  identify-upstream-jobs:
    name: identify-upstream-jobs
    # Build even if previous step failed, but permit cancelling the job.
    if: success() || failure()
    needs:
      - upstream-small-build
    environment:
      name: upstream-build
      deployment: false
    outputs:
      matrix: ${{ steps.set-upstream-matrix.outputs.matrix }}
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Build Matrix
        id: set-upstream-matrix
        run: |
          # Files/directories that trigger rebuild of everything.
          export ALL_PATTERN="\.github\/|bin\/print-matrix\.sh|common\/Makefile|upstream\/Makefile|upstream\/buildpack-deps|upstream\/ubuntu"
          # These are built in the previous step
          export EXCLUDED_PATTERN="upstream\/buildpack-deps|upstream\/ubuntu"
          # Package changes, only rebuild the specific packages.
          export PACKAGES_PATTERN="upstream\/"
          export PACKAGES_DIRECTORY=upstream
          # Remap changes to force build of base-dependency.
          export SED_REPLACEMENTS="-e s#opendatacube#gdal#g -e s#force#gdal#g -e s#postgis#postgres#g"
          bin/print-matrix.sh >>$GITHUB_OUTPUT
        env:
          CI_REGISTRY: ${{ vars.CI_REGISTRY }}
          CI_REGISTRY_BASE_PATH: ${{ vars.CI_REGISTRY_BASE_PATH }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}

  build-image:
    name: build-image
    needs:
      - identify-upstream-jobs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identify-upstream-jobs.outputs.matrix) }}
    environment:
      name: upstream-build
      deployment: false
    timeout-minutes: ${{ matrix.build-timeout }}
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # This is required for cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Build
        uses: ./.github/actions/docker-build
        with:
          build-path: ${{ matrix.package }}
          ci-registry: ${{ vars.CI_REGISTRY }}
          ci-registry-base-path: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          ci-registry-upstream-base-path: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          do-push: ${{ github.ref == 'refs/heads/main' }}
          docker-auth-config: ${{ secrets.DOCKER_AUTH_CONFIG_UPSTREAM_RW }}
          extra-repository: ${{ matrix.extra-repository }}
          extra-repository-token: ${{ secrets.PAT_EXTRA_REPO_RO }}
          organization-name: ${{ vars.ORGANIZATION_NAME }}

  # This job requires secrets from the repository, and those aren't exposed
  # in pull requests from forks. Testing changes to this job in a pull request
  # needs to be done from a branch of the repository itself.
  upstream-transfer:
    name: upstream-transfer
    if: github.ref == 'refs/heads/main'
    needs:
      - build-image
    environment:
      name: upstream-build
      deployment: false
    timeout-minutes: 10
    # FIXME: change to ubuntu-latest when ubuntu-latest is Ubuntu 26.04.
    runs-on: ubuntu-26.04
    # Variables/secrets in the container block are evaluated before the environment
    # variables, so these variables need to be defined at the repository level.
    container:
      # FIXME: use releases for version when we have that up and running on GitHub.
      image: ${{ vars.CI_REGISTRY }}/${{ vars.CI_REGISTRY_BASE_PATH }}/support-releaser:latest # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ vars.CI_REGISTRY_READ_USER }}
        password: ${{ secrets.CI_REGISTRY_READ_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Git information
        run: |
          # Running in a container requires to set safe directory manually.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SHORT_SHA=$(git rev-parse --short ${GITHUB_SHA})
          echo "COMMIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Transfer upstream images
        run: |
          make -C upstream upstream-transfer
        env:
          CI_REGISTRY: ${{ vars.CI_REGISTRY }}
          CI_REGISTRY_BASE_PATH: ${{ vars.CI_REGISTRY_BASE_PATH }}
          CI_REGISTRY_UPSTREAM_PATH: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          COMMIT_SHORT_SHA: ${{ env.COMMIT_SHORT_SHA }}
          DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG_RW }}
          UPSTREAM_IMAGES: ${{ vars.UPSTREAM_IMAGES }}
