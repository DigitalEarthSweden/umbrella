name: build-packages

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths: &paths
      - ".dockerignore"
      - ".github/actions/docker-build/action.yaml"
      - ".github/workflows/build-packages.yaml"
      - "common/Makefile"
      - "org-config/*/packages/**"
      - "packages/**"
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  identify-jobs:
    name: identify-jobs
    environment:
      name: upstream-build
      deployment: false
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    timeout-minutes: 10
    # FIXME: change to ubuntu-latest when ubuntu-latest is Ubuntu 26.04.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Build Matrix
        id: set-matrix
        run: bin/print-matrix.sh >>$GITHUB_OUTPUT
        env:
          CI_REGISTRY: ${{ vars.CI_REGISTRY }}
          CI_REGISTRY_BASE_PATH: ${{ vars.CI_REGISTRY_BASE_PATH }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}

  build-image:
    name: build-image
    needs:
      - identify-jobs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identify-jobs.outputs.matrix) }}
    environment:
      name: upstream-build
      deployment: false
    timeout-minutes: ${{ matrix.build-timeout }}
    # FIXME: change to ubuntu-latest when ubuntu-latest is Ubuntu 26.04.
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # This is required for cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Build
        uses: ./.github/actions/docker-build
        with:
          build-path: ${{ matrix.package }}
          ci-registry: ${{ vars.CI_REGISTRY }}
          ci-registry-base-path: ${{ vars.CI_REGISTRY_BASE_PATH }}
          ci-registry-upstream-base-path: ${{ vars.CI_REGISTRY_UPSTREAM_BASE_PATH }}
          do-push: ${{ github.ref == 'refs/heads/main' }}
          docker-auth-config: ${{ secrets.DOCKER_AUTH_CONFIG_RW }}
          extra-repository: ${{ matrix.extra-repository }}
          extra-repository-token: ${{ secrets.PAT_EXTRA_REPO_RO }}
          organization-name: ${{ vars.ORGANIZATION_NAME }}
