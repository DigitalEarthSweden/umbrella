name: datacube-ows

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths: &paths
      - ".dockerignore"
      - ".github/workflows/build-packages-datacube-ows.yaml"
      - ".github/workflows/docker-build.yaml"
      - "common/Makefile"
      - "org-config/*/packages/datacube-ows/**"
      - "packages/datacube-ows/**"
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  datacube-ows:
    name: datacube-ows
    permissions:
      id-token: write # This is required for cosign
    uses: ./.github/workflows/docker-build.yaml
    with:
      build-path: packages/datacube-ows
      timeout: 15
    secrets:
      docker-auth-config: ${{ secrets.DOCKER_AUTH_CONFIG_RW }}
