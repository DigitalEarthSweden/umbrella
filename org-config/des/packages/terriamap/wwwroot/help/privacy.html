    <!-- Bootstrap's "collapse" behaviour (navbar on narrow screens, FAQ accordion) without jQuery/bootstrap.js -->
    <script>
      document.querySelectorAll('[data-toggle="collapse"]').forEach(function (trigger) {
        trigger.addEventListener("click", function (event) {
          event.preventDefault();
          var selector = trigger.getAttribute("data-target") || trigger.getAttribute("href");
          var target = document.querySelector(selector);
          var parent = trigger.getAttribute("data-parent");
          function set(el, panel, open) {
            panel.classList.toggle("in", open);
            el.classList.toggle("collapsed", !open);
            el.setAttribute("aria-expanded", open);
          }
          if (parent && !target.classList.contains("in")) {
            document.querySelectorAll(parent + ' [data-toggle="collapse"]').forEach(function (other) {
              var panel = document.querySelector(other.getAttribute("data-target") || other.getAttribute("href"));
              if (panel !== target && panel.classList.contains("in")) set(other, panel, false);
            });
          }
          set(trigger, target, !target.classList.contains("in"));
        });
      });
    </script>
